# Versions used to produce the results. torch and torchvision are nightly CUDA 12.8 builds
# (2026-02-25); pytorch3d 0.7.9 is built from source against them.
name: fvs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/nightly/cu128
      - torch==2.12.0.dev20260225+cu128
      - torchvision==0.26.0.dev20260225+cu128
      - numpy==2.5.0
      - scipy==1.17.1
      - scikit-learn==1.8.0
      - pandas==3.0.1
      - opencv-python==4.11.0.86
      - open3d==0.19.0
      - trimesh==4.11.4
      - matplotlib==3.10.8
# pytorch3d: pip install "git+https://github.com/facebookresearch/pytorch3d.git@v0.7.9"
