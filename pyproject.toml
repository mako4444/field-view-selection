[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fvs"
version = "1.0.0"
description = "Viewpoint selection for 2D-3D localization with a frozen detectability field (offline replay experiments)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["fvs*"]
